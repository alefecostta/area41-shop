server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/area41-shop;
    index index.html;

    # arquivos internos do projeto
    location ~ /\.(git|github) { deny all; }
    location /deploy/ { deny all; }
    location /server/ { deny all; }

    # API (produtos, painel, upload de fotos)
    location /api/ {
        proxy_pass http://127.0.0.1:4141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    # fotos enviadas pelo painel
    location /uploads/ {
        alias /var/lib/area41/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # painel
    location = /consoleadmin { return 301 /consoleadmin/; }
    location /consoleadmin/ {
        try_files $uri $uri/ /consoleadmin/index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
