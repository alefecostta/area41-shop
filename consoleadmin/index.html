<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Console Admin — ÁREA 41 SHOP</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030504; --panel:#0A100C; --surface:#0F1611; --tile:#161F19; --line:#1E2A22; --line-2:#2B3B30;
  --ink:#EEF5EF; --ink-2:#B7C6BB; --muted:#7D8F83; --lime:#A6F45A; --lime-ink:#0D1F14; --red:#E5484D; --amber:#F5B14C; --violet:#A855F7;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap;transition:border-color .15s,background .15s,filter .15s}
.btn:hover{border-color:#3d5244}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:#FF8A8E;border-color:rgba(229,72,77,.35)}
.btn.danger:hover{background:rgba(229,72,77,.1)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:38px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 50% at 50% 0%,rgba(69,242,31,.12),transparent 70%)}
.login form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line-2);border-radius:24px;padding:28px 24px}
.login img{width:96px;margin:0 auto}
.login h1{font-family:var(--display);font-size:22px;text-align:center;margin-top:8px;letter-spacing:-.02em}
.login p{color:var(--muted);text-align:center;font-size:14px;margin:4px 0 20px}
.login .btn{width:100%;height:48px;margin-top:6px}
.login .err{color:#FF8A8E;font-size:13.5px;text-align:center;margin-top:12px;min-height:20px}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.side .brand img{width:44px}
.side .brand b{font-family:var(--display);font-size:15px;display:block}
.side .brand small{color:var(--muted);font-size:12px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:600;text-align:left}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--tile)}
.nav button.on{background:var(--tile);color:var(--ink);box-shadow:inset 3px 0 0 var(--lime)}
.side .bottom{margin-top:auto;display:grid;gap:8px}
.app>div{min-width:0}
.main{min-width:0;padding:24px 28px 80px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-family:var(--display);font-size:26px;letter-spacing:-.025em}
.head p{color:var(--muted);font-size:14px}
.mtabs{display:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-size:26px;margin-top:2px}
.stat.warn b{color:var(--amber)}
.stat.bad b{color:#FF8A8E}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2)}
.search svg{width:17px;height:17px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.chip .c{opacity:.7;margin-left:4px}

/* product list */
.plist{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prow{display:grid;grid-template-columns:56px minmax(0,2.2fr) 1fr 1fr 110px 120px;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.hd{color:var(--muted);font-size:12.5px;font-weight:600;padding:10px 14px;background:var(--surface)}
.prow img{width:56px;height:56px;border-radius:12px;background:#EEF2EC;object-fit:contain;padding:3px}
.prow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{color:var(--muted);font-size:12.5px}
.prow .pr b{display:block}
.prow .pr small{color:var(--muted);font-size:12px;text-decoration:line-through}
.prow .pr .off{color:var(--lime);font-size:12px;font-weight:700;text-decoration:none;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--tile);color:var(--ink-2)}
.pill.ok{background:rgba(166,244,90,.12);color:var(--lime)}
.pill.low{background:rgba(245,177,76,.14);color:var(--amber)}
.pill.out{background:rgba(229,72,77,.14);color:#FF8A8E}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* metrics */
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stat .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.stat.good b{color:var(--lime)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mgrid .card{margin-bottom:0}
.mgrid+.card,.mgrid+.mgrid,.card+.mgrid{margin-top:14px}
.chart{width:100%;height:220px;display:block}
.chart .grid{stroke:#1A241D;stroke-width:1;vector-effect:non-scaling-stroke}
.chart .axis{stroke:#2B3B30;stroke-width:1;vector-effect:non-scaling-stroke}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .peak{fill:var(--ink-2);font-size:11px;font-weight:700;font-family:var(--display)}
.chart .bar{fill:#4FAE2A}
.chart .bar.hl{fill:#7BD93A}
.chart .hit{fill:transparent;cursor:crosshair}
.ctip{position:fixed;z-index:99;pointer-events:none;opacity:0;background:#F2F7F2;color:#0D1F14;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:opacity .1s;max-width:320px}
.muted{color:var(--muted);font-size:13.5px}
.hb,.funnel{display:grid;gap:10px}
.hbr{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.ht,.ft{height:10px;border-radius:99px;background:var(--tile);overflow:hidden}
.ht i,.ft i{display:block;height:100%;border-radius:0 4px 4px 0;background:#4FAE2A}
.hbr b{min-width:34px;text-align:right}
.fr{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 56px 42px;gap:10px;align-items:center;font-size:13.5px}
.fl{color:var(--ink-2)}
.ft{height:14px}
.fr b{text-align:right}
.fp{color:var(--muted);font-size:12.5px;text-align:right}
.otable{display:grid}
.orow{display:grid;grid-template-columns:100px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.orow:first-child{border-top:0}
.ot{color:var(--muted)}
.oi em{font-style:normal;color:var(--muted)}
/* toggle */
.tg{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.tg input{position:absolute;opacity:0;width:0;height:0}
.tg i{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex-shrink:0}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:99px;background:#fff;transition:transform .15s}
.tg input:checked+i{background:var(--lime)}
.tg input:checked+i::after{transform:translateX(16px);background:var(--lime-ink)}
.tg input:focus-visible+i{outline:2px solid var(--lime);outline-offset:2px}
.tg span small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}

/* editor drawer */
.drawer{position:fixed;inset:0;z-index:50;visibility:hidden}
.drawer.open{visibility:visible}
.drawer .ov{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.drawer.open .ov{opacity:1}
.drawer .pn{position:absolute;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer.open .pn{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--display);font-size:20px;letter-spacing:-.02em}
.db{flex:1;overflow-y:auto;padding:18px 20px 30px}
.df{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.df .r{display:flex;gap:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card>h3{font-family:var(--display);font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card>h3 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.f input,.f textarea,.f select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:0;transition:border-color .15s}
.f textarea{height:84px;padding:10px 12px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--lime)}
.f small{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.f.err input{border-color:var(--red)}
.affix{position:relative}
.affix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.affix input{padding-left:36px}
.affix.r span{left:auto;right:12px}
.affix.r input{padding-left:12px;padding-right:32px}

.photo{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center}
.photo .pv{width:160px;height:160px;border-radius:16px;background:#EEF2EC;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line-2)}
.photo .pv img{width:100%;height:100%;object-fit:contain;padding:8px}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--lime);background:rgba(166,244,90,.05)}
.drop b{color:var(--ink);display:block;font-size:14px;margin-bottom:2px}

.stars{display:flex;gap:4px}
.stars button{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--line-2)}
.stars button svg{width:26px;height:26px}
.stars button.on{color:#F5C451}
.stars button:hover{background:var(--tile)}

.discount{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.discount .pill{font-size:13px}
.discount input{width:80px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--tile);padding:0 10px;outline:0}

.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick label{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.catpick input,.f .catpick input{accent-color:var(--lime);width:16px;height:16px;min-width:16px;padding:0;margin:0;border:0;flex-shrink:0}
.catpick label{white-space:nowrap;line-height:1}
.catpick label:has(input:checked){border-color:var(--lime);color:var(--ink);background:rgba(166,244,90,.08)}

.flavors{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frow{display:grid;grid-template-columns:28px 1fr 150px 38px;gap:8px;align-items:center;padding:6px 8px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow.hd{background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px}
.frow .ix{color:var(--muted);font-size:12px;text-align:center}
.frow input.fn{height:38px;border-radius:10px;border:1px solid transparent;background:transparent;padding:0 10px;outline:0;width:100%}
.frow input.fn:hover{border-color:var(--line-2)}
.frow input.fn:focus{border-color:var(--lime);background:var(--surface)}
.stepper{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;height:38px;overflow:hidden}
.stepper button{width:36px;height:100%;font-size:17px;color:var(--ink-2)}
.stepper button:hover{background:var(--tile)}
.stepper input{width:100%;min-width:0;height:100%;border:0;background:transparent;text-align:center;outline:0;font-family:var(--display);font-weight:600}
.frow.zero .stepper{border-color:rgba(229,72,77,.4)}
.frow.zero input.fn{color:var(--muted)}
.fact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* categories */
.crow{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;outline:0}
.crow input:focus{border-color:var(--lime)}
.crow .ord{display:flex;flex-direction:column;gap:2px}
.crow .ord button{width:28px;height:19px;border-radius:6px;background:var(--tile);font-size:11px;color:var(--ink-2)}
.crow .cnt{color:var(--muted);font-size:13px;white-space:nowrap}

/* order list inside category */
.olist{margin-top:8px;display:grid;gap:6px}
.oitem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.oitem img{width:34px;height:34px;border-radius:8px;background:#EEF2EC;object-fit:contain;padding:2px}
.oitem span{flex:1;font-size:13.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:fixed;left:50%;bottom:24px;z-index:99;transform:translate(-50%,16px);opacity:0;background:#F2F7F2;color:#0D1F14;font-weight:600;padding:12px 18px;border-radius:999px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:#fff}
.confirm{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.65)}
.confirm.open{display:flex}
.confirm .box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:22px}
.confirm h3{font-family:var(--display);font-size:18px}
.confirm p{color:var(--ink-2);margin-top:6px}
.confirm .r{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.saving{position:fixed;top:14px;right:16px;z-index:90;background:var(--tile);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2);display:none}
.saving.on{display:block}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtabs{display:flex;position:sticky;top:0;z-index:30;background:rgba(3,5,4,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px;gap:6px;overflow-x:auto;align-items:center}
  .mtabs img{width:34px;margin-right:4px}
  .mtabs button{height:36px;padding:0 12px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
  .mtabs button.on{background:var(--lime);color:var(--lime-ink)}
  .main{padding:16px 14px 80px}
  .stats,.stats.s4{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr 1.2fr 44px 36px}
  .orow{grid-template-columns:1fr auto}
  .orow .oi{grid-column:1/-1;grid-row:2}
  .head .chips{width:100%}
  .prow{grid-template-columns:52px minmax(0,1fr) auto;row-gap:6px}
  .prow.hd{display:none}
  .prow img{width:52px;height:52px}
  .prow .pr,.prow .st{grid-column:2}
  .prow .pr{display:flex;gap:8px;align-items:baseline}
  .prow .act{grid-column:3;grid-row:1 / span 3;align-self:center}
  .prow .tgc{grid-column:2}
  .grid2,.grid3{grid-template-columns:1fr}
  .photo{grid-template-columns:110px 1fr}
  .photo .pv{width:110px;height:110px}
  .frow{grid-template-columns:1fr 130px 34px}
  .frow .ix{display:none}
  .crow{grid-template-columns:auto 1fr auto;}
  .df{flex-direction:column-reverse;align-items:stretch;gap:8px}
  .df>div{display:flex;gap:8px}
  .df .btn{flex:1}
  .head .btn{width:100%}
  .crow .note,.crow .cnt{grid-column:2}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login" hidden>
  <form id="loginForm">
    <img src="/img/logo.webp" alt="ÁREA 41">
    <h1>Console Admin</h1>
    <p>Entre com a senha do painel</p>
    <div class="f"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Entrar</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="/img/logo.webp" alt=""><div><b>ÁREA 41</b><small>Console Admin</small></div></div>
    <nav class="nav" id="nav">
      <button data-view="metricas" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg>Métricas</button>
      <button data-view="produtos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Produtos</button>
      <button data-view="categorias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Categorias</button>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const brl=v=>"R$ "+Number(v||0).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const parseMoney=v=>{if(v===""||v==null)return null;const s=String(v).replace(/[^\d,.-]/g,"");const n=Number(s.includes(",")?s.replace(/\./g,"").replace(",","."):s);return isFinite(n)?Math.round(n*100)/100:null;};
const money=v=>v==null||v===""?"":Number(v).toFixed(2).replace(".",",");
const slug=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const clone=o=>JSON.parse(JSON.stringify(o));
const STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
let LOW=3;

let CAT=null, view="metricas", mRange="7d", M=null, filter="todos", query="", editing=null, isNew=false;

/* ---------- api ---------- */
async function api(path,opts){
  opts=opts||{};
  const r=await fetch(path,{method:opts.method||"GET",headers:Object.assign({"x-requested-with":"a41"},opts.body?{"Content-Type":"application/json"}:{}),body:opts.body?JSON.stringify(opts.body):undefined,credentials:"same-origin"});
  let data={}; try{data=await r.json();}catch(e){}
  if(r.status===401&&path!=="/api/admin/login"&&path!=="/api/admin/password"){showLogin();throw new Error(data.error||"Faça login novamente.");}
  if(!r.ok)throw new Error(data.error||("Erro "+r.status));
  return data;
}
async function saveCatalog(msg){
  $("#saving").classList.add("on");
  try{
    const res=await api("/api/admin/catalog",{method:"PUT",body:{baseVersion:CAT.version,catalog:CAT}});
    CAT=res; toast(msg||"Salvo"); render(); return true;
  }catch(e){toast(e.message,true);return false;}
  finally{$("#saving").classList.remove("on");}
}

/* ---------- auth ---------- */
function showLogin(){$("#app").hidden=true;$("#login").hidden=false;setTimeout(()=>$("#pw").focus(),50);}
async function boot(){
  try{await api("/api/admin/me");}catch(e){return showLogin();}
  try{CAT=await api("/api/admin/catalog");}catch(e){return toast(e.message,true);}
  $("#login").hidden=true;$("#app").hidden=false;render();
}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();$("#loginErr").textContent="";
  try{await api("/api/admin/login",{method:"POST",body:{password:$("#pw").value}});$("#pw").value="";boot();}
  catch(err){$("#loginErr").textContent=err.message;}
};
$$("[data-logout]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin/logout",{method:"POST"});}catch(e){}CAT=null;showLogin();});

/* ---------- helpers ---------- */
const totalStock=p=>(p.flavors||[]).reduce((a,f)=>a+(Number(f.stock)||0),0);
function stockPill(p){const t=totalStock(p);if(!t)return'<span class="pill out">Esgotado</span>';if(t<=LOW)return`<span class="pill low">${t} un.</span>`;return`<span class="pill ok">${t} un.</span>`;}
const offPct=p=>p.old&&p.old>p.price?Math.round((1-p.price/p.old)*100):0;
const catsOf=id=>CAT.categories.filter(c=>c.items.includes(id));
let tt;function toast(m,err){const t=$("#toast");t.textContent=m;t.className="toast on"+(err?" err":"");clearTimeout(tt);tt=setTimeout(()=>t.className="toast",2600);}
function confirmBox(title,text,yes){
  return new Promise(res=>{$("#cfT").textContent=title;$("#cfP").textContent=text;$("#cfYes").textContent=yes||"Excluir";$("#confirm").classList.add("open");$("#cfNo").focus();
    const done=v=>{$("#confirm").classList.remove("open");res(v);};$("#cfYes").onclick=()=>done(true);$("#cfNo").onclick=()=>done(false);});
}

/* ---------- views ---------- */
function setView(v){view=v;$$("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===v));render();window.scrollTo(0,0);}
$$("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
function render(){if(!CAT)return;({metricas:renderMetrics,produtos:renderProducts,categorias:renderCategories,config:renderConfig})[view]();}

/* ---------- métricas ---------- */
const RANGES=[["today","Hoje"],["yesterday","Ontem"],["7d","7 dias"],["30d","30 dias"],["90d","90 dias"],["all","Tudo"]];
const intf=n=>Number(n||0).toLocaleString("pt-BR");
const dlabel=d=>{const [y,m,dd]=d.split("-");return dd+"/"+m;};
async function loadMetrics(){
  try{M=await api("/api/admin/metrics?range="+mRange);}catch(e){toast(e.message,true);M=null;}
  if(view==="metricas")renderMetrics();
}
function kpi(label,value,sub,cls){return `<div class="stat ${cls||""}"><small>${label}</small><b class="num">${value}</b>${sub?`<span class="sub">${sub}</span>`:""}</div>`;}
function niceMax(v){if(v<=0)return 4;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;let step=(n<=1?1:n<=2?2:n<=5?5:10)*p;step=Math.max(1,step);return step*4;}
function colChart(rows,key,fmt,tipFn){
  const W=720,H=220,L=44,B=26,T=12,R=8,max=niceMax(Math.max(...rows.map(r=>r[key]),0));
  const n=rows.length,slot=(W-L-R)/n,bw=Math.max(3,Math.min(24,slot*0.6));
  const y=v=>T+(H-T-B)*(1-v/max);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-8}" y="${yy+4}" class="tick" text-anchor="end">${fmt(v,true)}</text>`;}
  const every=Math.ceil(n/12);let bars="",labels="";
  rows.forEach((r,i)=>{const x=L+slot*i+(slot-bw)/2,v=r[key],yy=y(v),h=H-B-yy,rad=Math.min(4,h,bw/2);
    if(v>0)bars+=`<path class="bar" d="M${x},${H-B} V${yy+rad} Q${x},${yy} ${x+rad},${yy} H${x+bw-rad} Q${x+bw},${yy} ${x+bw},${yy+rad} V${H-B} Z"/>`;
    bars+=`<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${H-T-B}" data-tip="${esc(tipFn(r))}"/>`;
    if(i%every===0||i===n-1)labels+=`<text x="${L+slot*i+slot/2}" y="${H-8}" class="tick" text-anchor="middle">${esc(r.label)}</text>`;});
  const mi=rows.reduce((b,r,i)=>r[key]>rows[b][key]?i:b,0);
  const peak=rows[mi]&&rows[mi][key]>0?`<text x="${L+slot*mi+slot/2}" y="${y(rows[mi][key])-6}" class="peak" text-anchor="middle">${fmt(rows[mi][key])}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="none">${g}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="axis"/>${bars}${peak}${labels}</svg>`;
}
function hbars(list,fmt,empty){
  if(!list.length)return `<p class="muted">${empty||"Sem dados no período."}</p>`;
  const max=Math.max(...list.map(x=>x.v),1);
  return `<div class="hb">${list.map(x=>`<div class="hbr" title="${esc(x.name)}: ${fmt(x.v)}"><span class="hn">${esc(x.name)}</span><span class="ht"><i style="width:${Math.max(2,x.v/max*100)}%"></i></span><b class="num">${fmt(x.v)}</b></div>`).join("")}</div>`;
}
function renderMetrics(){
  const head=`<div class="head"><div><h1>Métricas</h1><p>Como os clientes usam a loja: visitas, carrinhos e pedidos enviados no WhatsApp.</p></div>
    <div class="chips" role="tablist" aria-label="Período">${RANGES.map(([k,l])=>`<button class="chip ${mRange===k?"on":""}" data-range="${k}">${l}</button>`).join("")}<button class="chip" data-mrefresh title="Atualizar">↻</button></div></div>`;
  if(!M||M.range!==mRange){$("#main").innerHTML=head+`<div class="empty">Carregando métricas…</div>`;if(!M||M.range!==mRange)loadMetrics();return;}
  const k=M.kpis, single=M.daily.length===1;
  const series=single?M.hours.map((v,h)=>({label:h+"h",v})):M.daily.map(d=>Object.assign({label:dlabel(d.day)},d));
  const f0=M.funnel[0][1]||0;
  $("#main").innerHTML=head+`
   <div class="stats s4">
     ${kpi("Visitantes",intf(k.visitors),`${intf(k.productViews)} abriram algum produto`)}
     ${kpi("Carrinhos criados",intf(k.carts),`${intf(k.adds)} vezes adicionaram itens`)}
     ${kpi("Valor nos carrinhos",brl(k.cartValue),"soma do último valor de cada carrinho")}
     ${kpi("Pedidos enviados no WhatsApp",intf(k.orders),`${intf(k.items)} pods`,"good")}
     ${kpi("Valor dos pedidos enviados",brl(k.revenue),`ticket médio ${brl(k.avgTicket)}`,"good")}
     ${kpi("Conversão",k.conversion.toLocaleString("pt-BR")+"%",`${k.cartConversion.toLocaleString("pt-BR")}% dos carrinhos viraram pedido`)}
     ${kpi("Carrinhos abandonados",intf(k.abandoned),`${brl(k.abandonedValue)} que não foram enviados`,"warn")}
     ${kpi("Cliques no grupo VIP",intf(k.groupClicks),`${intf(k.whatsappClicks)} cliques no WhatsApp da loja`)}
   </div>
   <div class="mgrid">
     <div class="card"><h3>${single?"Visitas por hora":"Pedidos enviados por dia"}<small>passe o mouse nas barras</small></h3>
       ${single?colChart(series,"v",(v)=>intf(Math.round(v)),r=>`${r.label}: ${intf(r.v)} visitas`):colChart(series,"orders",(v)=>intf(Math.round(v)),r=>`${r.label} — ${intf(r.orders)} pedidos · ${brl(r.revenue)} · ${intf(r.visitors)} visitantes · ${intf(r.carts)} carrinhos`)}</div>
     <div class="card"><h3>${single?"Funil de hoje":"Visitantes por dia"}<small>${single?"":"passe o mouse nas barras"}</small></h3>
       ${single?"":colChart(series,"visitors",(v)=>intf(Math.round(v)),r=>`${r.label} — ${intf(r.visitors)} visitantes · ${intf(r.carts)} carrinhos · ${intf(r.orders)} pedidos`)}
       ${single?funnelHTML(f0):""}</div>
   </div>
   ${single?"":`<div class="card"><h3>Funil de vendas<small>pessoas que chegaram em cada etapa</small></h3>${funnelHTML(f0)}</div>`}
   <div class="mgrid">
     <div class="card"><h3>Mais pedidos<small>unidades enviadas no WhatsApp</small></h3>${hbars(M.topOrdered,intf)}</div>
     <div class="card"><h3>Mais adicionados ao carrinho<small>unidades</small></h3>${hbars(M.topAdded,intf)}</div>
     <div class="card"><h3>Mais vistos<small>aberturas do produto</small></h3>${hbars(M.topViewed,intf)}</div>
     <div class="card"><h3>Sabores mais pedidos<small>unidades</small></h3>${hbars(M.topFlavors,intf)}</div>
   </div>
   <div class="card"><h3>Últimos pedidos enviados<small>clique em “Enviar pedido no WhatsApp”</small></h3>
     ${M.recent.length?`<div class="otable">${M.recent.map(o=>`<div class="orow"><span class="ot">${new Date(o.ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span><span class="oi">${o.items.map(i=>`${i.qty}x ${esc(i.name)} <em>${esc(i.flavor)}</em>`).join(", ")}</span><b class="num">${brl(o.v)}</b></div>`).join("")}</div>`:'<p class="muted">Nenhum pedido enviado neste período.</p>'}
   </div>
   <p class="muted" style="margin-top:6px">“Pedidos enviados” conta quem tocou em <b>Enviar pedido no WhatsApp</b>. O pagamento é confirmado por você no WhatsApp. As métricas são anônimas e começam a contar a partir de agora.</p>`;
}
function funnelHTML(f0){
  return `<div class="funnel">${M.funnel.map(([l,v],i)=>`<div class="fr"><span class="fl">${l}</span><span class="ft"><i style="width:${f0?Math.max(1.5,v/f0*100):0}%"></i></span><b class="num">${intf(v)}</b><span class="fp">${f0&&i?Math.round(v/f0*100)+"%":""}</span></div>`).join("")}</div>`;
}

function renderProducts(){
  LOW=CAT.config.lowStock==null?3:(CAT.config.lowStock||0);
  const P=CAT.products;
  const units=P.reduce((a,p)=>a+totalStock(p),0), out=P.filter(p=>!totalStock(p)).length, low=P.filter(p=>{const t=totalStock(p);return t>0&&t<=LOW;}).length;
  const counts={todos:P.length,ativos:P.filter(p=>p.active).length,ocultos:P.filter(p=>!p.active).length,baixo:low,esgotados:out};
  const q=query.toLowerCase();
  const list=P.filter(p=>{
    if(filter==="ativos"&&!p.active)return false; if(filter==="ocultos"&&p.active)return false;
    const t=totalStock(p); if(filter==="baixo"&&!(t>0&&t<=LOW))return false; if(filter==="esgotados"&&t)return false;
    return !q||p.name.toLowerCase().includes(q)||(p.brand||"").toLowerCase().includes(q)||p.flavors.some(f=>f.name.toLowerCase().includes(q));
  });
  $("#main").innerHTML=`
   <div class="head"><div><h1>Produtos</h1><p>Preços, fotos, sabores e estoque. Tudo que você salvar aparece na loja na hora.</p></div>
     <button class="btn primary" id="newP"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo produto</button></div>
   <div class="stats">
     <div class="stat"><small>Produtos</small><b class="num">${P.length}</b></div>
     <div class="stat"><small>Unidades em estoque</small><b class="num">${units}</b></div>
     <div class="stat warn"><small>Estoque baixo (até ${LOW})</small><b class="num">${low}</b></div>
     <div class="stat bad"><small>Esgotados</small><b class="num">${out}</b></div>
   </div>
   <div class="toolbar">
     <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg><input id="pq" placeholder="Buscar por nome, marca ou sabor" value="${esc(query)}" aria-label="Buscar produtos"></label>
     <div class="chips">${[["todos","Todos"],["ativos","Na loja"],["ocultos","Ocultos"],["baixo","Estoque baixo"],["esgotados","Esgotados"]].map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-filter="${k}">${l}<span class="c">${counts[k]}</span></button>`).join("")}</div>
   </div>
   <div class="plist">
     <div class="prow hd"><span></span><span>Produto</span><span>Preço</span><span>Estoque</span><span>Na loja</span><span></span></div>
     ${list.length?list.map(p=>`<div class="prow">
        <img src="${esc(p.img?(p.img[0]==="/"?p.img:"/"+p.img):"/img/logo.webp")}" alt="" loading="lazy">
        <div class="nm"><b>${esc(p.name)}</b><small>${esc(p.brand||"Sem marca")} · ${Number(p.puffs||0).toLocaleString("pt-BR")} puffs · ${p.flavors.length} ${p.flavors.length===1?"sabor":"sabores"}${p.best?" · ★ Mais vendido":""}</small></div>
        <div class="pr"><b class="num">${brl(p.price)}</b>${p.old?`<small>${brl(p.old)}</small><span class="off">−${offPct(p)}%</span>`:""}</div>
        <div class="st">${stockPill(p)}</div>
        <div class="tgc"><label class="tg"><input type="checkbox" data-active="${p.id}" ${p.active?"checked":""} aria-label="Mostrar ${esc(p.name)} na loja"><i></i></label></div>
        <div class="act rowact"><button class="btn sm" data-edit="${p.id}">Editar</button></div>
      </div>`).join(""):`<div class="empty">Nenhum produto encontrado.</div>`}
   </div>`;
  $("#pq").oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;renderProducts();const i=$("#pq");i.focus();i.setSelectionRange(pos,pos);};
  $("#newP").onclick=()=>openEditor(null);
}

function renderCategories(){
  const C=CAT.categories;
  $("#main").innerHTML=`
   <div class="head"><div><h1>Categorias</h1><p>A ordem aqui é a ordem das abas na loja. Categorias “em destaque” aparecem no bloco verde do topo.</p></div>
     <button class="btn primary" id="newC"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova categoria</button></div>
   <div class="plist">${C.length?C.map((c,i)=>`
     <div class="crow" data-ci="${i}">
       <div class="ord"><button data-up="${i}" aria-label="Subir" ${i?"":"disabled"}>▲</button><button data-down="${i}" aria-label="Descer" ${i<C.length-1?"":"disabled"}>▼</button></div>

function orderPanel(i){
  const c=CAT.categories[i],slot=$(`[data-oslot="${i}"]`);

/* ---------- image upload ---------- */
let pickCb=null;
function pickImage(cb){pickCb=cb;$("#fileIn").value="";$("#fileIn").click();}
$("#fileIn").onchange=e=>{const f=e.target.files[0];if(f&&pickCb)uploadFile(f,pickCb);};
async function uploadFile(file,cb){
  if(!/^image\/(png|jpe?g|webp)$/.test(file.type))return toast("Use uma imagem JPG, PNG ou WEBP.",true);
  toast("Enviando foto…");
  try{
    const data=await resize(file,1000);
    const r=await api("/api/admin/upload",{method:"POST",body:{data}});
    cb(r.url);toast("Foto enviada. Lembre de salvar.");
  }catch(err){toast(err.message,true);}
}
function resize(file,max){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let d=c.toDataURL("image/webp",.86);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",.88);res(d);};
    img.onerror=()=>rej(new Error("Não consegui ler essa imagem."));img.src=url;
  });
}

  $("#flvTable").innerHTML=`<div class="frow hd"><span class="ix">#</span><span>Sabor</span><span>Estoque</span><span></span></div>`+
    (F.length?F.map((f,i)=>`<div class="frow ${Number(f.stock)?"":"zero"}"><span class="ix">${i+1}</span>

function collect(){

  const rv=Number($("#e-rv").value); p.rating=rv>0?{value:Math.min(5,rv),count:Number($("#e-rc").value)||0}:null;

  p._cats=$$("[data-ecat]").filter(x=>x.checked).map(x=>x.dataset.ecat);
  p.flavors=p.flavors.map(f=>({name:f.name.trim(),stock:Number(f.stock)||0})).filter(f=>f.name);
  return p;
}

  if(isNew){let id=slug(p.name)||"produto",base=id,k=2;while(CAT.products.some(x=>x.id===id))id=base+"-"+(k++);p.id=id;}
  const clean={id:p.id,name:p.name,brand:p.brand,puffs:p.puffs,img:p.img,price:p.price,old:p.old,best:p.best,rating:p.rating,active:p.active,description:p.description,flavors:p.flavors};
  if(isNew)CAT.products.unshift(clean);else CAT.products[CAT.products.findIndex(x=>x.id===p.id)]=clean;
  CAT.categories.forEach(c=>{const has=c.items.includes(p.id),want=p._cats.includes(c.id);if(want&&!has)c.items.push(p.id);if(!want&&has)c.items=c.items.filter(x=>x!==p.id);});
  const s=new Set(CAT.config.suggested||[]);p._sugg?s.add(p.id):s.delete(p.id);CAT.config.suggested=[...s];
  if(await saveCatalog(isNew?"Produto criado":"Produto salvo"))closeEditor();else CAT=backup;
};
$("#edDup").onclick=()=>{const p=collect();const copy=clone(p);copy.name=p.name+" (cópia)";copy.id="";editing=copy;isNew=true;$("#edTitle").textContent="Novo produto (cópia)";$("#edDel").hidden=true;$("#edDup").hidden=true;renderEditor();toast("Cópia criada. Ajuste e salve.");};
$("#edDel").onclick=async()=>{
  const p=editing;if(!(await confirmBox("Excluir produto?",`“${p.name}” sai da loja e do painel. Se quiser só esconder, desligue “Mostrar na loja”.`)))return;
  const backup=clone(CAT);
  CAT.products=CAT.products.filter(x=>x.id!==p.id);CAT.categories.forEach(c=>c.items=c.items.filter(x=>x!==p.id));CAT.config.suggested=(CAT.config.suggested||[]).filter(x=>x!==p.id);
  if(await saveCatalog("Produto excluído"))closeEditor();else CAT=backup;
};

/* ---------- global clicks ---------- */
document.addEventListener("click",async e=>{
  const t=e.target;
  const rg=t.closest("[data-range]");if(rg){mRange=rg.dataset.range;M=null;renderMetrics();return;}
  if(t.closest("[data-mrefresh]")){M=null;renderMetrics();return;}
  if(t.closest("[data-close]")){closeEditor();return;}
  const ed=t.closest("[data-edit]");if(ed){openEditor(ed.dataset.edit);return;}
  const fl=t.closest("[data-filter]");if(fl){filter=fl.dataset.filter;renderProducts();return;}
  const fs=t.closest("[data-fst]");if(fs){const [i,d]=fs.dataset.fst.split(":").map(Number);const f=editing.flavors[i];f.stock=Math.max(0,(Number(f.stock)||0)+d);const inp=$(`[data-fstock="${i}"]`);inp.value=f.stock;inp.closest(".frow").classList.toggle("zero",!f.stock);sumStock();return;}
  const fd=t.closest("[data-fdel]");if(fd){editing.flavors.splice(+fd.dataset.fdel,1);renderFlavors();return;}
  // categories
  const up=t.closest("[data-up]"),dn=t.closest("[data-down]");
  if(up||dn){syncCatInputs();const i=+(up||dn).dataset[up?"up":"down"],j=up?i-1:i+1;const C=CAT.categories;[C[i],C[j]]=[C[j],C[i]];renderCategories();return;}
  const cd=t.closest("[data-cdel]");if(cd){syncCatInputs();const c=CAT.categories[+cd.dataset.cdel];if(await confirmBox("Excluir categoria?",`“${c.name}” some da loja. Os produtos dela continuam existindo.`)){CAT.categories.splice(+cd.dataset.cdel,1);renderCategories();toast("Clique em Salvar categorias para confirmar.");}return;}
  const co=t.closest("[data-corder]");if(co){syncCatInputs();orderPanel(+co.dataset.corder);return;}
  const ou=t.closest("[data-oup]"),od=t.closest("[data-odown]"),orm=t.closest("[data-orm]");
  if(ou||od||orm){const [i,k]=(ou||od||orm).dataset[ou?"oup":od?"odown":"orm"].split(":").map(Number);const it=CAT.categories[i].items;
    if(orm)it.splice(k,1);else{const j=ou?k-1:k+1;[it[k],it[j]]=[it[j],it[k]];}
    syncCatInputs();renderCategories();orderPanel(i);return;}
});
function syncCatInputs(){$$("[data-cname]").forEach(i=>CAT.categories[+i.dataset.cname].name=i.value);$$("[data-cnote]").forEach(i=>CAT.categories[+i.dataset.cnote].note=i.value);$$("[data-cpromo]").forEach(i=>CAT.categories[+i.dataset.cpromo].promo=i.checked);}
document.addEventListener("change",async e=>{
  const a=e.target.closest("[data-active]");
  if(a){const p=CAT.products.find(x=>x.id===a.dataset.active);p.active=a.checked;await saveCatalog(a.checked?"Produto visível na loja":"Produto escondido da loja");}
  if(e.target.matches("[data-cname],[data-cnote],[data-cpromo]"))syncCatInputs();
});
const _saveC=()=>{syncCatInputs();};
document.addEventListener("click",e=>{if(e.target.closest("#saveC"))_saveC();},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#confirm").classList.contains("open"))$("#cfNo").click();else if(editing)closeEditor();}
  if((e.ctrlKey||e.metaKey)&&e.key==="s"&&editing){e.preventDefault();$("#edSave").click();}});
window.addEventListener("beforeunload",e=>{if(editing){e.preventDefault();e.returnValue="";}});

const tip=document.createElement("div");tip.className="ctip";document.body.appendChild(tip);
document.addEventListener("mousemove",e=>{const h=e.target.closest&&e.target.closest(".hit");if(!h){tip.style.opacity=0;$$(".bar.hl").forEach(b=>b.classList.remove("hl"));return;}
  tip.textContent=h.dataset.tip;tip.style.opacity=1;const x=Math.min(window.innerWidth-tip.offsetWidth-12,e.clientX+14);tip.style.left=x+"px";tip.style.top=(e.clientY-40)+"px";
  $$(".bar.hl").forEach(b=>b.classList.remove("hl"));const prev=h.previousElementSibling;if(prev&&prev.classList.contains("bar"))prev.classList.add("hl");});
document.addEventListener("touchstart",e=>{const h=e.target.closest&&e.target.closest(".hit");if(h){toast(h.dataset.tip);}},{passive:true});
setInterval(()=>{if(view==="metricas"&&!document.hidden&&CAT){api("/api/admin/metrics?range="+mRange).then(r=>{M=r;if(view==="metricas"&&!editing)renderMetrics();}).catch(()=>{});}},60000);
boot();
</script>
